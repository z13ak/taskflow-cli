[project]
name = "taskflow-cli"
version = "1.0.0"
description = "A Rich-powered terminal task tracker."
requires-python = ">=3.10"
dependencies = ["rich>=13.7.0"]

[project.scripts]
taskflow = "taskflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["taskflow"]
